name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pytest
      - run: python -m pytest -q

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name UmaBot --icon assets/icon.ico --collect-submodules umabot run.py
      - name: Smoke-test the .exe
        run: |
          copy config.toml dist\
          dist\UmaBot.exe --help
          dist\UmaBot.exe check
          dist\UmaBot.exe schedule
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/templates | Out-Null
          Copy-Item dist/UmaBot.exe, config.toml, README.md package/
          Copy-Item templates/README.md package/templates/
          Get-ChildItem templates -Filter *.png -ErrorAction SilentlyContinue | Copy-Item -Destination package/templates/
      - uses: actions/upload-artifact@v4
        with:
          name: UmaBot-windows
          path: package/

  release:
    needs: windows-exe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UmaBot-windows
          path: package
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          (cd package && zip -qr ../UmaBot-windows.zip .)
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest UmaBot-windows.zip --repo "$REPO" \
            --title "UmaBot (latest build)" --target "$GITHUB_SHA" \
            --notes "Windows build of ${GITHUB_SHA::7}. Unzip it and double-click UmaBot.exe."
