name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pytest customtkinter pillow
      - run: python -m pytest -q
      - name: Build the app window on a virtual display
        run: |
          sudo apt-get install -y -q xvfb > /dev/null
          xvfb-run -a python -m umabot selftest

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build UmaBot.exe
        run: pyinstaller --onefile --windowed --name UmaBot --icon assets/icon.ico --add-data "assets;assets" --collect-all customtkinter --collect-submodules umabot run.py
      - name: Smoke-test the .exe
        shell: pwsh
        run: |
          Copy-Item config.toml dist/
          $p = Start-Process -FilePath dist/UmaBot.exe -ArgumentList "selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath dist/UmaBot.exe -ArgumentList "schedule" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "schedule failed with exit code $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/templates | Out-Null
          Copy-Item dist/UmaBot.exe, config.toml package/
          Get-ChildItem templates -Filter *.png -ErrorAction SilentlyContinue | Copy-Item -Destination package/templates/
      - uses: actions/upload-artifact@v4
        with:
          name: UmaBot-windows
          path: package/

  release:
    needs: windows-exe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UmaBot-windows
          path: package
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p package/templates
          (cd package && zip -qr ../UmaBot-windows.zip .)
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest UmaBot-windows.zip --repo "$REPO" \
            --title "UmaBot (latest build)" --target "$GITHUB_SHA" \
            --notes "Windows build of ${GITHUB_SHA::7}. Unzip it and open UmaBot.exe."
