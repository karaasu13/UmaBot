name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pytest
      - run: python -m pytest -q

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name UmaBot --icon assets/icon.ico --collect-submodules umabot run.py
      - name: Smoke-test the .exe
        run: |
          copy config.toml dist\
          dist\UmaBot.exe --help
          dist\UmaBot.exe check
          dist\UmaBot.exe schedule
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/templates | Out-Null
          Copy-Item dist/UmaBot.exe, config.toml, README.md package/
          Copy-Item templates/README.md package/templates/
          Get-ChildItem templates -Filter *.png -ErrorAction SilentlyContinue | Copy-Item -Destination package/templates/
      - uses: actions/upload-artifact@v4
        with:
          name: UmaBot-windows
          path: package/
