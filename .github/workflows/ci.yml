name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install opencv-python-headless numpy pytest
      - run: python -m pytest -q

  exe-windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name UmaBot --collect-submodules umabot run.py
      - name: Testar o .exe
        run: |
          copy config.toml dist\
          dist\UmaBot.exe --help
          dist\UmaBot.exe verificar
          dist\UmaBot.exe horario
      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote/templates | Out-Null
          Copy-Item dist/UmaBot.exe, config.toml, README.md pacote/
          Copy-Item templates/README.md pacote/templates/
          Get-ChildItem templates -Filter *.png -ErrorAction SilentlyContinue | Copy-Item -Destination pacote/templates/
      - uses: actions/upload-artifact@v4
        with:
          name: UmaBot-windows
          path: pacote/
