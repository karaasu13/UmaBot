# ============================================================================
#  UmaBot configuration. Everything can be changed here without touching code.
# ============================================================================

[game]
window = "Umamusume"                 # game window title
# The game can run at any resolution, windowed or fullscreen, on any monitor.
# Templates are kept at the scale of a 1920x1080 fullscreen game; the bot measures the UI scale of
# your window on its own (once per window size, saved in calibration.json).
reference_resolution = [1920, 1080]
scale = "auto"                       # "auto", or a fixed number (e.g. 0.75) if auto ever gets it wrong
threshold = 0.85                     # minimum similarity (0-1) to consider a button visible

[game.thresholds]                    # per-template thresholds, if one needs to be stricter/looser
next2 = 0.9

[schedule]
enabled = true
start = "10:30"                 # the "normal" time you'd start playing
end = "01:00"                   # may go past midnight
jitter_min = 45                 # start and end shift by up to ±45 min every day
breaks_per_day = [1, 3]         # random breaks inside the active window (lunch, dinner, ...)
break_length_min = [15, 70]
finish_run_after_hours = true   # after hours: finish the current run, but don't start a new one

[human]
reaction_s = [0.2, 0.8]          # delay between a button appearing and the click
hold_ms = [55, 140]             # how long the mouse button stays pressed
distraction_chance = 0.02       # chance, per click, of a short pause
distraction_s = [4, 30]
poll_s = [0.4, 0.9]             # time between screenshots

[tp]
wait_min = [25, 45]             # out of TP: wait this long before trying again (no TP is ever wasted)
guess_after = 3                 # Start Career pressed this many times without a run starting = out of TP
guess_window_min = 10           # ...within this many minutes (0 in guess_after turns the guess off)

[card]
# Which card to borrow is chosen in the app (or with "card"); it's saved in settings.json.
templates = ["card", "card_full"]
threshold = 0.75
scales = [0.4, 1.8]             # the web image is searched at several sizes
scroll_pos = "auto"             # where to scroll the list: "auto" (below its title) or [x, y] fractions (see "position")
scroll_amount = -8
scroll_attempts = 20            # scrolls through the list before giving up (stops early at the bottom)
refresh = "refresh"             # friend list refresh button (optional)
max_failures = 8                # stop if the card isn't found X times in a row

[safety]
max_repeats = 25                # same click X times in a row without the screen changing = stuck, stop
unknown_screen_min = 40         # X min without recognising the screen: save a screenshot to logs/
discord_webhook = ""            # optional: webhook URL to get notified when the bot stops
stop_on_user_input = true       # stop as soon as you use the mouse or keyboard

# ============================================================================
#  RULES: checked top to bottom; the first one that matches is executed.
#
#  if_seen       templates that must ALL be on screen
#  if_not_seen   templates that must NOT be on screen
#  any_of        click the first of these that is visible
#  click         where to click (defaults to the first if_seen template)
#  action        click | stop | card | trainee | agenda | wait_tp | center
#  starts_run    only happens inside the schedule
#  counts_run    counts as a new run
#  checks_tp     starts a run only if there's enough TP (used to notice that TP ran out)
#  once_per_run  fires at most once per run
#  only_if       only used when that option is on (load_agenda: an agenda name is set in the app)
#  notify        message shown in the app (and on Discord) when it fires
#  optional      for rare screens: not counted as missing while its picture isn't there
#  {focus}       the training focus chosen in the app (balanced, stamina or sprint)
#
#  Rules that use templates you don't have yet disable themselves (see "check").
# ============================================================================

# ---- safety --------------------------------------------------------------------
[[rule]]
name = "Stop if the veterans list is full"
if_seen = ["stop_veterans_full"]
action = "stop"
optional = true

[[rule]]
name = "Out of TP: say No to restoring TP and wait"
# "You need N more TP to start a Career playthrough. Restore TP?" — never Restore (it spends items)
if_seen = ["tp_not_enough"]
click = "no"
action = "wait_tp"

[[rule]]
name = "Out of TP: close Recover TP and wait"
if_seen = ["tp_popup"]
click = "close"
action = "wait_tp"

[[rule]]
name = "Connection error"
if_seen = ["connection_error"]
click = "retry"
optional = true

# ---- starting a run --------------------------------------------------------------
[[rule]]
name = "Choose the trainee"
if_seen = ["trainee_select"]
action = "trainee"

[[rule]]
name = "Pick the legacies automatically"
if_seen = ["legacy_empty"]
click = "auto_select"
notify = "No legacies were set, so they were picked automatically. Next time choose parents with the best aptitudes for farming (aim for A everywhere)."

[[rule]]
name = "Confirm the automatic legacies"
if_seen = ["auto_select_dialog"]
click = "ok"

[[rule]]
name = "Pick the support card"
if_seen = ["friend_list"]
action = "card"

[[rule]]
name = "Open the friend list"
if_seen = ["empty_friend_slot"]

[[rule]]
name = "Switch to Independent Training"
if_seen = ["final_confirmation", "it_tab_off"]
click = "it_tab_off"

[[rule]]
name = "Training focus"
if_seen = ["final_confirmation", "focus_{focus}_off"]
click = "focus_{focus}_off"

[[rule]]
name = "Open the agenda"
if_seen = ["final_confirmation", "agenda_edit"]
click = "agenda_edit"
once_per_run = true
only_if = "load_agenda"

[[rule]]
name = "Open My Agendas"
if_seen = ["agenda_window", "my_agendas_button"]
click = "my_agendas_button"
once_per_run = true
only_if = "load_agenda"

[[rule]]
name = "Load the saved agenda"
if_seen = ["my_agendas_window"]
action = "agenda"
once_per_run = true
only_if = "load_agenda"

[[rule]]
name = "Start Independent Training (spends 30 TP)"
if_seen = ["final_confirmation", "it_start"]
click = "it_start"
starts_run = true
counts_run = true

[[rule]]
name = "Start career"
if_seen = ["start_career"]
if_not_seen = ["empty_friend_slot", "final_confirmation"]
starts_run = true
checks_tp = true

[[rule]]
name = "Go to Career"
if_seen = ["home_career"]
starts_run = true

# ---- end of a run --------------------------------------------------------------
[[rule]]
name = "Complete career"
if_seen = ["complete_career"]

[[rule]]
name = "Finish the career"
if_seen = ["finish"]

[[rule]]
name = "Keep the sparks (never reroll: it costs 30 TP)"
if_seen = ["reroll_sparks"]
click = "confirm"

[[rule]]
name = "Confirm the sparks"
if_seen = ["keep_sparks"]
click = "confirm"

[[rule]]
name = "Back to Home"
if_seen = ["to_home"]

# ---- everything else: Next, OK, Close ---------------------------------------------
[[rule]]
name = "Generic buttons"
any_of = ["next", "ok", "close", "next2", "skip", "skip_big"]
